name: Deploy public site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/build-site-config.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public configuration
        env:
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          BOT_HEALTH_URL: ${{ vars.BOT_HEALTH_URL }}
          SUPPORT_SERVER_URL: ${{ vars.SUPPORT_SERVER_URL }}
        run: python scripts/build-site-config.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
